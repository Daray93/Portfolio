<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Manrope is self-hosted via @fontsource/manrope (see GlobalStyle.jsx)
         -- loading it again here from Google Fonts meant every visitor paid
         for two separate copies of the same typeface. -->

    <!-- Fontshare: General Sans (headings) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap"
      rel="stylesheet"
    />

    <title>Dara Phillips | Product Designer</title>

    <style>
      /* Global font setup */
      body {
        font-family: 'Manrope', sans-serif;
        margin: 0;
        padding: 0;
        background: #fff;
        color: #1a1a1a;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'General Sans', sans-serif;
        font-weight: 600;
        margin: 0;
      }

      a {
        text-decoration: none;
        color: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
