<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG first: black or white to match the browser's light/dark mode.
         PNG for browsers without SVG favicons (Safari). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/iOS-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Poppins is self-hosted via @fontsource (see
         GlobalStyle.jsx) -- loading it again here from a CDN would mean
         every visitor paying for two copies of the same typeface. -->

    <title>Dara Phillips | Product Designer</title>
    <link rel="canonical" href="https://daraphillips.com/" />
    <meta
      name="description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />

    <!-- Open Graph / social link previews (LinkedIn, Slack, iMessage...).
         /public/og-image.png is 1200x630: name, role and headshot on the
         homepage's dark background. LinkedIn caches previews -- after
         changing it, re-scrape with linkedin.com/post-inspector. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daraphillips.com/" />
    <meta property="og:title" content="Dara Phillips | Product Designer" />
    <meta
      property="og:description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />
    <meta property="og:image" content="https://daraphillips.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dara Phillips, Product Designer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://daraphillips.com/og-image.png" />
    <meta name="twitter:title" content="Dara Phillips | Product Designer" />
    <meta
      name="twitter:description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />

    <style>
      /* Paints before the app loads, in the visitor's theme (see
         ThemeModeContext.jsx): their saved pick, else their device's
         setting (the script below). Headings share the body font (Poppins,
         see GlobalStyle.jsx); only size and weight set them apart. */
      body {
        font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        background: #161616;
        color: #f4f4f4;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: inherit;
        font-weight: 600;
        margin: 0;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      html.light body {
        background: #f2f0ea;
        color: #17171a;
      }
    </style>
    <script>
      (function () {
        var pick = null;
        try {
          pick = localStorage.getItem("theme-pref");
        } catch (e) {}
        var light = pick ? pick === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        if (light) document.documentElement.classList.add("light");
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
