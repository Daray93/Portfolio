<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Manrope is self-hosted via @fontsource/manrope (see GlobalStyle.jsx)
         -- loading it again here from Google Fonts meant every visitor paid
         for two separate copies of the same typeface. -->

    <!-- Fontshare: General Sans (headings) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap"
      rel="stylesheet"
    />

    <title>Dara Phillips | Product Designer</title>
    <link rel="canonical" href="https://daraphillips.com/" />
    <meta
      name="description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />

    <!-- Open Graph / social link previews. og:image points at a file that
         doesn't exist yet -- drop the real graphic in /public/og-image.png
         (1200x630 recommended) once one's ready. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://daraphillips.com/" />
    <meta property="og:title" content="Dara Phillips | Product Designer" />
    <meta
      property="og:description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />
    <meta property="og:image" content="https://daraphillips.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dara Phillips | Product Designer" />
    <meta
      name="twitter:description"
      content="Product designer based in Ireland. Case studies in mobile, AI/VR, and health-tech design — designed, built, and shipped end-to-end."
    />

    <style>
      /* Global font setup */
      body {
        font-family: 'Manrope', sans-serif;
        margin: 0;
        padding: 0;
        background: #fff;
        color: #1a1a1a;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'General Sans', sans-serif;
        font-weight: 600;
        margin: 0;
      }

      a {
        text-decoration: none;
        color: inherit;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
